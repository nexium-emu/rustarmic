[package]
name    = "rustarmic"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "0BSD"
description = "High-performance ARM64 (AArch64) → x86_64 dynamic recompiler / JIT, inspired by dynarmic"
repository = "https://github.com/Mythrax/rustarmic"
readme  = "README.md"
keywords = ["jit", "aarch64", "arm64", "emulator", "recompiler"]
categories = ["emulators", "compilers"]

[lib]
name = "rustarmic"
path = "src/lib.rs"

[dependencies]
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "encoder", "block_encoder", "code_asm"] }
region   = "3"
bitflags = "2"
smallvec = { version = "1", features = ["union"] }
thiserror = "2"
disarm64 = { version = "0.1", default-features = false, features = ["full"] }
# Unicorn is opt-in: builds the engine from source via cmake/ninja, which
# needs libclang (LLVM) on the host. Enable with `--features unicorn` to run
# the diff tests in `tests/`.
#
# Windows note: if `cmake` resolves to an msys2 build first (e.g. via
# `c:\devkitPro\msys2\usr\bin`) it will mangle the Windows-style paths the
# build script passes in and fail. Set `CMAKE` to the Windows CMake and
# prepend the bundled VS Ninja before running cargo:
#   $env:CMAKE = "C:\Program Files\CMake\bin\cmake.exe"
#   $env:PATH  = "C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja;$env:PATH"
#   cargo test --features unicorn
unicorn-engine = { version = "2", optional = true }
# Optional lightweight trace logging. Enabled via the `tracing` feature; emits
# `log::trace!` calls at block-compile and block-exit points so embedders can
# wire the rustarmic JIT into their existing `log` infrastructure.
log = { version = "0.4", optional = true }

[dev-dependencies]
rand = "0.8"
rand_chacha = "0.3"

[features]
default = []
unicorn = ["dep:unicorn-engine"]
tracing = ["dep:log"]

[profile.release]
opt-level   = 3
lto         = "fat"
codegen-units = 1
panic       = "abort"
debug       = 1

[profile.bench]
opt-level   = 3
lto         = "fat"
codegen-units = 1
debug       = 1

[[test]]
name = "unicorn_diff"
path = "tests/unicorn_diff.rs"
required-features = ["unicorn"]

[[test]]
name = "fuzz_random"
path = "tests/fuzz_random.rs"
required-features = ["unicorn"]

[[test]]
name = "smoke"
path = "tests/smoke.rs"
